services:
  postgres:
    # PG 18 起 PGDATA 版本化：镜像内为 /var/lib/postgresql/18/docker，
    # 声明的 VOLUME 是 /var/lib/postgresql。挂旧路径 /var/lib/postgresql/data 会启动失败。
    image: postgres:18.7
    restart: unless-stopped
    # 不发布 ports：数据库只留在 internal 网络；宿主可能直接路由容器 IP。
    # 确需宿主访问时叠加 docker-compose.host-access.yml，且只绑 127.0.0.1。
    expose:
      - "5432"
    environment:
      # 内置超级用户只用于 bootstrap；业务迁移与运行分别是 migrator/app 两个低权角色
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD is required}
      POSTGRES_APP_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # 探活用运行角色经 TCP 真正认证一次查询；pg_isready 只证明端口接受连接，
    # 不能证明账号与库可用。口令经环境变量传入（PGPASSWORD），不出现在 argv。
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_APP_PASSWORD\" psql -h 127.0.0.1 -U vision_app -d $$POSTGRES_DB -tAc 'SELECT 1' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - internal

  # 显式迁移工具：业务表只由它建（计划 §2.1：Docker init 只建角色/库/扩展）。
  #   docker compose --profile tools run --rm flyway migrate
  # 刻意不放进默认栈：`up -d` 不该顺手改库结构，迁移是发布步骤而不是副作用。
  # 连接参数走 FLYWAY_* 环境变量，口令由 compose 从 .env 插值，不进 argv。
  flyway:
    image: flyway/flyway:13.13.0
    profiles: ["tools"]
    command: ["migrate"]
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      FLYWAY_USER: vision_migrator
      FLYWAY_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD is required}
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 不发布 ports：Redis 只留在 internal 网络
    expose:
      - "6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis-data:/data
    healthcheck:
      # REDISCLI_AUTH 传口令：避免密码出现在进程命令行
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    networks:
      - internal

  chromadb:
    # 1.7 GB 生产机默认不跑向量库；需要 RAG 时显式 --profile rag
    profiles: ["rag"]
    image: ghcr.io/chroma-core/chroma:1.0.0
    restart: unless-stopped
    # 不发布 ports：向量库只留在 internal 网络，向量内容不经宿主暴露
    expose:
      - "8000"
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma-data:/chroma/chroma
    # 镜像里没有 curl / wget / python3，只有 bash 和 grep：用 bash 内建的 /dev/tcp
    # 探一次 /api/v2/heartbeat，读到 200 才算就绪。端口通但服务没起来时连接被拒，
    # 探针立刻以非 0 退出，不会卡到超时。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\r\nHost: 127.0.0.1\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
      interval: 10s
      timeout: 5s
      retries: 6
      # 冷启动要加载持久化数据，留够时间，避免首次部署就被判为不健康
      start_period: 30s
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: vision-space-backend:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /app/tmp:uid=10001,gid=10001,mode=0770
    # 只发布业务端口且只绑回环：管理端口 9081 绑定容器内 127.0.0.1，天然不对外
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # 容器内必须监听所有接口，docker 才能把端口映射出去；宿主机侧只发布到
      # 127.0.0.1（见上面的 ports）。原生部署相反：业务端口只绑回环，
      # 由本机 nginx 反代（deploy/app.env.example 的 SERVER_ADDRESS）。
      SERVER_ADDRESS: 0.0.0.0
      # 库、JDBC 会话、JVM 三者必须同区（ADR-0004 §3）：postgres 与库时区都是
      # Asia/Shanghai，容器里不设 TZ 的话 JVM 默认 UTC，pgjdbc 会把会话时区也设成 UTC，
      # 墙钟时间就差 8 小时。这里显式给 JVM 同一个区。
      TZ: ${TZ:-Asia/Shanghai}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?ApplicationName=vision-space
      SPRING_DATASOURCE_USERNAME: vision_app
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # 生产 profile 下缺任一项都会拒绝启动（#28 契约）
      SPRING_AI_DASHSCOPE_API_KEY: ${SPRING_AI_DASHSCOPE_API_KEY:?required in prod}
      SPRING_AI_OPENAI_API_KEY: ${SPRING_AI_OPENAI_API_KEY:?required in prod}
      # 模型端点与模型名：缺端点时 OpenAI 客户端默认打 api.openai.com（大陆不可达），
      # Agent 同步调用会挂到超时、SSE 一个字节都回不来（2026-11-25 实机验收）。
      SPRING_AI_OPENAI_BASE_URL: ${SPRING_AI_OPENAI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:-qwen-plus}
      ALI_YUN_AI_API_KEY: ${ALI_YUN_AI_API_KEY:?required in prod}
      VISION_SPACE_PEXELS_API_KEY: ${VISION_SPACE_PEXELS_API_KEY:?required in prod}
      VISION_SPACE_VISION_RECOGNITION_API_KEY: ${VISION_SPACE_VISION_RECOGNITION_API_KEY:?required in prod}
      VISION_SPACE_VISION_RECOGNITION_BASE_URL: ${VISION_SPACE_VISION_RECOGNITION_BASE_URL:-https://www.dmxapi.cn}
      VISION_SPACE_VISION_RECOGNITION_MODEL: ${VISION_SPACE_VISION_RECOGNITION_MODEL:-GLM-4.1V-Thinking-Flash}
      # 小程序登录（可选）：未配置时应用照常启动，只有 /user/wx/* 返回失败
      VISION_SPACE_WX_APPID: ${VISION_SPACE_WX_APPID:-}
      VISION_SPACE_WX_SECRET: ${VISION_SPACE_WX_SECRET:-}
      VISION_SPACE_DEFAULT_PASSWORD: ${VISION_SPACE_DEFAULT_PASSWORD:?required in prod}
      # 站内图片检索（RAG）：chromadb 只在 rag profile 里，默认编排**不起**向量库，
      # 所以这里默认把整条链路关掉，避免默认栈指向一个不存在的服务。
      # 要开 RAG：docker compose --profile rag up，并把下面两项设为 dashscope / chroma。
      SPRING_AI_MODEL_EMBEDDING_TEXT: ${SPRING_AI_MODEL_EMBEDDING_TEXT:-none}
      SPRING_AI_VECTORSTORE_TYPE: ${SPRING_AI_VECTORSTORE_TYPE:-none}
      VISION_SPACE_CHROMA_HOST: ${VISION_SPACE_CHROMA_HOST:-http://chromadb}
      VISION_SPACE_CHROMA_PORT: ${VISION_SPACE_CHROMA_PORT:-8000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9081/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    networks:
      - internal
      # 出站（DashScope、Pexels 等外部服务）唯一出口；internal 网络没有外联
      - edge

volumes:
  postgres-data:
  redis-data:
  chroma-data:

networks:
  internal:
    internal: true
  edge:
