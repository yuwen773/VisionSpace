services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    # 不发布 ports：数据库只留在 internal 网络，宿主与公网均不可达。
    # 确需宿主访问时叠加 docker-compose.host-access.yml，且只绑 127.0.0.1。
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_APP_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    # 探活用专用账号经 TCP 真正认证一次查询（mysqladmin ping 在拒绝访问时
    # 仍返回 0，不能证明账号可用）；口令经环境变量传入（MYSQL_PWD），
    # 不出现在进程命令行
    healthcheck:
      test: ["CMD-SHELL", "export MYSQL_PWD=\"$$MYSQL_APP_PASSWORD\" && mysql -h 127.0.0.1 -uhealthcheck --silent -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 不发布 ports：Redis 只留在 internal 网络
    expose:
      - "6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis-data:/data
    healthcheck:
      # REDISCLI_AUTH 传口令：避免密码出现在进程命令行
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: vision-space-backend:local
    restart: unless-stopped
    # 只发布业务端口且只绑回环：管理端口 9081 绑定容器内 127.0.0.1，天然不对外
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: vision_app
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # 生产 profile 下缺任一项都会拒绝启动（#28 契约）
      SPRING_AI_DASHSCOPE_API_KEY: ${SPRING_AI_DASHSCOPE_API_KEY:?required in prod}
      SPRING_AI_OPENAI_API_KEY: ${SPRING_AI_OPENAI_API_KEY:?required in prod}
      ALI_YUN_AI_API_KEY: ${ALI_YUN_AI_API_KEY:?required in prod}
      VISION_SPACE_PEXELS_API_KEY: ${VISION_SPACE_PEXELS_API_KEY:?required in prod}
      VISION_SPACE_VISION_RECOGNITION_API_KEY: ${VISION_SPACE_VISION_RECOGNITION_API_KEY:?required in prod}
      VISION_SPACE_DEFAULT_PASSWORD: ${VISION_SPACE_DEFAULT_PASSWORD:?required in prod}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9081/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    networks:
      - internal
      # 出站（DashScope、Pexels 等外部服务）唯一出口；internal 网络没有外联
      - edge

volumes:
  mysql-data:
  redis-data:

networks:
  internal:
    internal: true
  edge:
