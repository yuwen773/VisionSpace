# Standalone test configuration. Never import application-local/prod or .env.
server:
  address: 127.0.0.1
  # 与生产一致：反向代理透传的 Host / 协议要还原，否则 TLS 终止后的同源请求会被判成跨站
  forward-headers-strategy: framework
  servlet:
    context-path: /api
# 隔离验收使用明文 http：Secure Cookie 不会被客户端回传，这里必须关闭。
sa-token:
  cookie:
    secure: false
spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: visionspace-acceptance
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 5000
  session:
    store-type: redis
    timeout: 300
    redis:
      namespace: acceptance:session
  ai:
    openai:
      api-key: acceptance-dummy
      chat:
        options:
          model: acceptance-model
    dashscope:
      api-key: acceptance-dummy
    mcp:
      client:
        enabled: false
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
vision-space:
  websocket:
    # 隔离验收用短租约期限：过期接管用例不必等 30s
    lease-ttl-seconds: 3
    # 续期节奏跟随期限（1/3），否则短租约会先于续期过期
    lease-renew-interval-ms: 1000
  # 隔离验收同样走真实的 CSRF 与来源判定，不做放行
  web:
    trusted-origins: ""
    csrf-enabled: true
  security:
    default-password: acceptance-only
    # 测试用低成本，避免每次登录都付生产级 CPU 代价
    password-bcrypt-cost: 4
  # 受控替身只监听回环；生产配置保持 false，私网与元数据地址仍然拒绝
  outbound:
    allow-loopback: true
  pexels:
    api-key: acceptance-dummy
  # 行为上报的限流：隔离验收里压到 50 次/分钟，便于验证超限被拒绝且可观察
  picture-action:
    rate-limit-per-minute: 50
  picture-stats:
    aggregate:
      # 隔离验收里把后台聚合的间隔调长：聚合逻辑由用例直接驱动，
      # 后台任务不与用例争抢同一批事件
      interval-ms: 3600000
  vision-recognition:
    api-key: acceptance-dummy
    model: acceptance-model
aliYunAi:
  apiKey: acceptance-dummy
logging:
  level:
    root: WARN
