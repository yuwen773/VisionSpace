server:
  port: 8081
  # 反向代理透传的入口信息必须被框架采用：否则 TLS 在 nginx 终止后，
  # 框架看到的仍是 http，会把本站的 https 请求误判成跨站并直接拒绝。
  # 必须用 framework（ForwardedHeaderFilter）：native 只还原协议不还原主机，
  # 主机对不上依然判为跨站。
  forward-headers-strategy: framework
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
## Sa-Token 令牌 Cookie
# Sa-Token 默认不给令牌 Cookie 加 Secure，HTTPS 入口下浏览器仍会明文回传。
# 生产入口统一为 HTTPS，所以默认开启；只有明文 http 的隔离验收才临时关闭。
sa-token:
  cookie:
    secure: ${VISION_SPACE_COOKIE_SECURE:true}
    http-only: true
    same-site: strict
## 项目自定义配置
vision-space:
  # 安全配置
  security:
    # 创建用户时使用的初始密码。生产必须通过环境变量注入，不提供默认值。
    default-password: ${VISION_SPACE_DEFAULT_PASSWORD:}
    # 新密码摘要的 BCrypt 成本因子；登录时发现更低成本的摘要会逐次升级
    password-bcrypt-cost: ${VISION_SPACE_PASSWORD_COST:12}
  # 浏览器入口：可信跨站来源与 CSRF 防护
  web:
    # 允许携带 Cookie 调用的跨站来源（协议 + 主机 + 端口）。同源请求不受限制。
    trusted-origins: ${VISION_SPACE_TRUSTED_ORIGINS:http://localhost:5173}
    csrf-enabled: ${VISION_SPACE_CSRF_ENABLED:true}
    csrf-cookie-name: VS_CSRF
    csrf-header-name: X-CSRF-Token
    csrf-token-max-age: 7200
  # 阿里云 AI 配置
  aliyun-ai:
    base-url: "https://dashscope.aliyuncs.com/api/v1"
    create-out-painting-task: "https://dashscope.aliyuncs.com/api/v1/services/aigc/image2image/out-painting"
    get-out-painting-task: "https://dashscope.aliyuncs.com/api/v1/tasks/%s"
  # Agent 配置
  agent:
    summary-threshold: 20
    messages-to-keep: 10
    max-explore-count: 3
    max-confirm-count: 2
    max-iteration-count: 15
    history-truncate-length: 100
    history-truncate-reserve: 97
    max-messages-to-trim: 10
    max-feedback-history-size: 100
    summary-max-length: 500
    summary-truncate-length: 497
    max-history-page-size: 100
  # 上传额度与速率（用户级）
  upload:
    # 每个用户每天的 Agent 临时上传次数
    agent-daily-limit: 100
    # 每个用户每天在图库中的上传次数
    gallery-daily-limit: 200
    # 单个用户可保留的资源总字节数（默认 1 GiB）
    max-total-bytes: 1073741824
  # 颜色提取配置
  color-extract:
    method: median-cut  # median-cut（默认）或 kmeans
    fallback-enabled: true
  # 首页推荐配置
  recommend:
    engagement-weight: 0.40
    freshness-weight: 0.20
    quality-weight: 0.20
    conversion-weight: 0.10
    manual-weight: 0.10
    time-decay-rate: 0.05
    cache-ttl-minutes: 5
    # 重排配置
    reorder:
      author-window-size: 20
      author-max-count: 2
      category-max-consecutive: 3
  # 图片统计聚合配置
  picture-stats:
    aggregate:
      batch-size: 500
      interval-ms: 300000
    retention:
      days: 7


spring:
  application:
    name: vision-space
  profiles:
    active: local # ,prod
  # 虚拟线程配置
  threads:
    virtual:
      enabled: true
  # 数据库配置：仅开发默认值，生产由 application-prod.yml 与环境变量覆盖
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/vision_space
    username: root
    password: ${MYSQL_PASSWORD:123456}
  # Redis 配置：仅开发默认值，生产由 application-prod.yml 与环境变量覆盖
  data:
    redis:
      database: 0
      host: localhost
      port: 6379
      timeout: 5000
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          max-wait: -1
      connect-timeout: 3000
  # Session 配置
  session:
    store-type: redis
    # session 30 天后过期
    timeout: 2592000
    cookie:
      # 站点通过同源入口访问，跨站请求本来就不该携带会话
      same-site: strict
  # 开放更大的文件上传体积
  servlet:
    multipart:
      max-file-size: 10MB
mybatis-plus:
  configuration:
    # MyBatis 配置
    map-underscore-to-camel-case: false
    # 仅在开发环境打印日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    enable-sql-runner: true
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
# 接口文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yuwen.visionspace.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-open-api: true
