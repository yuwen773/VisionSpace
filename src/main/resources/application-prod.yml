# 生产配置：所有秘密仅从环境变量注入，缺失时由 ProductionSecretsGuard 拒绝启动。
# 本文件与镜像中不得出现真实口令、密钥或内网地址。
spring:
  application:
    name: vision-space
  # 数据库配置；连接池启动窗口有限重试（30 秒）：依赖延迟时给启动留出缓冲，
  # 重试耗尽仍连不上则以明确异常快速失败（退出码非 0），而不是无限阻塞或带病启动。
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      initialization-fail-timeout: 30000
      validation-timeout: 5000
      # 2 vCPU / 1.7 GB 生产机：连接池上限收紧，避免 PG 连接内存叠加
      maximum-pool-size: 5
      minimum-idle: 1
      # 与 MySQL 的 REPEATABLE READ 明确区分：统一 READ COMMITTED
      transaction-isolation: TRANSACTION_READ_COMMITTED
  # Flyway 不在运行时依赖里；这里显式关闭，防止未来误引入 starter 后启动自动迁移
  flyway:
    enabled: false
  # Redis 配置
  data:
    redis:
      database: 0
      host: ${SPRING_DATA_REDIS_HOST:}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 5000
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          max-wait: -1
      connect-timeout: 3000
  # 外部服务密钥
  # 自动配置的排除项统一放在 application.yml：这里再写一份会把基础配置里的
  # 列表整体覆盖掉（列表属性按来源替换而非合并）。
  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:}
    # 站内图片检索（RAG）：这里是 prod profile 的默认值，面向「自带 Chroma」的部署。
    # 仓库自带的 docker-compose.yml 默认**不起** chromadb（它在 rag profile 里），
    # 因此 compose 会把 SPRING_AI_MODEL_EMBEDDING_TEXT / SPRING_AI_VECTORSTORE_TYPE
    # 默认下发成 none，覆盖这里的值；阿里云手册的 app.env 同样显式置 none。
    # 有 Chroma 的部署不用动；没有的把这两项都置 none 即可（整条链路就不装配）。
    model:
      embedding:
        text: dashscope
    vectorstore:
      type: chroma
      chroma:
        client:
          # compose 里的 chromadb 服务；外部部署时覆盖 VISION_SPACE_CHROMA_HOST
          host: ${VISION_SPACE_CHROMA_HOST:http://chromadb}
          port: ${VISION_SPACE_CHROMA_PORT:8000}
        collection-name: ${VISION_SPACE_CHROMA_COLLECTION:picture_vectors}
        # 建集合发生在建连时；RAG 关闭时根本不会走到这里
        initialize-schema: true
    dashscope:
      api-key: ${SPRING_AI_DASHSCOPE_API_KEY:}
management:
  server:
    # 管理端口与业务端口分离，且只绑定回环地址：容器内 127.0.0.1 之外的
    # 接口不会监听管理端点，不为探活扩大攻击面。
    port: 9081
    address: 127.0.0.1
  endpoint:
    health:
      # 健康明细只进日志/诊断入口，不通过探活端点对外输出，避免泄露组件拓扑
      show-details: never
      show-components: never
      probes:
        # 显式启用后 /actuator/health/readiness、/liveness 常驻可用，不依赖 K8s 环境探测
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
  endpoints:
    web:
      exposure:
        # 只暴露健康端点；其余管理能力（env/heapdump/...）一律不开放
        include: health
  health:
    redis:
      # 探活超时明显短于容器健康检查间隔：Redis 故障时 readiness 要在
      # 秒级返回 503，而不是拖到容器探活超时。本地 PING 是毫秒级。
      timeout: 1s
aliYunAi:
  apiKey: ${ALI_YUN_AI_API_KEY:}
sa-token:
  cookie:
    # 生产入口必须是 HTTPS：令牌 Cookie 不允许在明文链路上回传
    secure: true
    http-only: true
    same-site: strict
vision-space:
  security:
    default-password: ${VISION_SPACE_DEFAULT_PASSWORD:}
    # 新摘要成本；存量低成本摘要会在成功登录后逐次升级
    password-bcrypt-cost: ${VISION_SPACE_PASSWORD_COST:12}
  web:
    # 生产为 HTTPS 同源入口：同源请求不受该列表限制，这里只放行额外的可信来源。
    # 需要跨站访问时显式列出（含协议），留空表示只信同源。
    trusted-origins: ${VISION_SPACE_TRUSTED_ORIGINS:}
    csrf-enabled: true
  pexels:
    api-key: ${VISION_SPACE_PEXELS_API_KEY:}
  vision-recognition:
    api-key: ${VISION_SPACE_VISION_RECOGNITION_API_KEY:}

# 生产关闭 SQL 参数日志：MyBatis 会把 accessKey/secretKey 原样打印到 stdout
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
