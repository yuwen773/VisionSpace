# 生产配置：所有秘密仅从环境变量注入，缺失时由 ProductionSecretsGuard 拒绝启动。
# 本文件与镜像中不得出现真实口令、密钥或内网地址。
spring:
  application:
    name: vision-space
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  # Redis 配置
  data:
    redis:
      database: 0
      host: ${SPRING_DATA_REDIS_HOST:}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 5000
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          max-wait: -1
      connect-timeout: 3000
  # 外部服务密钥
  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:}
    dashscope:
      api-key: ${SPRING_AI_DASHSCOPE_API_KEY:}
aliYunAi:
  apiKey: ${ALI_YUN_AI_API_KEY:}
sa-token:
  cookie:
    # 生产入口必须是 HTTPS：令牌 Cookie 不允许在明文链路上回传
    secure: true
    http-only: true
    same-site: strict
vision-space:
  security:
    default-password: ${VISION_SPACE_DEFAULT_PASSWORD:}
    # 新摘要成本；存量低成本摘要会在成功登录后逐次升级
    password-bcrypt-cost: ${VISION_SPACE_PASSWORD_COST:12}
  web:
    # 生产为 HTTPS 同源入口：同源请求不受该列表限制，这里只放行额外的可信来源。
    # 需要跨站访问时显式列出（含协议），留空表示只信同源。
    trusted-origins: ${VISION_SPACE_TRUSTED_ORIGINS:}
    public-origin: ${VISION_SPACE_PUBLIC_ORIGIN:}
    csrf-enabled: true
  pexels:
    api-key: ${VISION_SPACE_PEXELS_API_KEY:}
  vision-recognition:
    api-key: ${VISION_SPACE_VISION_RECOGNITION_API_KEY:}

# 生产关闭 SQL 参数日志：MyBatis 会把 accessKey/secretKey 原样打印到 stdout
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
