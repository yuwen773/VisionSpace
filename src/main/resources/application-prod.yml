# 生产配置：所有秘密仅从环境变量注入，缺失时由 ProductionSecretsGuard 拒绝启动。
# 本文件与镜像中不得出现真实口令、密钥或内网地址。
spring:
  application:
    name: vision-space
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  # Redis 配置
  data:
    redis:
      database: 0
      host: ${SPRING_DATA_REDIS_HOST:}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 5000
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          max-wait: -1
      connect-timeout: 3000
  # 外部服务密钥
  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:}
    dashscope:
      api-key: ${SPRING_AI_DASHSCOPE_API_KEY:}
aliYunAi:
  apiKey: ${ALI_YUN_AI_API_KEY:}
vision-space:
  security:
    default-password: ${VISION_SPACE_DEFAULT_PASSWORD:}
  pexels:
    api-key: ${VISION_SPACE_PEXELS_API_KEY:}
  vision-recognition:
    api-key: ${VISION_SPACE_VISION_RECOGNITION_API_KEY:}

# 生产关闭 SQL 参数日志：MyBatis 会把 accessKey/secretKey 原样打印到 stdout
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
