# VisionSpace nginx 站点（原生部署）
#
# 安装：
#   install -m 644 deploy/nginx-visionspace.conf /etc/nginx/conf.d/visionspace.conf
#   nginx -t && systemctl reload nginx
#
# 两段式启用（第一次签证书前先只留 HTTP 段）：
#   1. certbot --nginx -d visionspace.space -d www.visionspace.space --redirect -m <邮箱> --agree-tos -n
#      certbot 会就地改写本文件，补出 443 段与证书路径；
#   2. 签发完成后把下面 443 段取消注释，并把 80 段改成只做跳转（return 301）。
#
# 业务端口：应用只绑 127.0.0.1:8081（app.env 的 SERVER_ADDRESS），
# 这里反代到回环地址，不经公网。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 访问日志脱敏：服务端只认请求头里的令牌，不接受 URL 形式的令牌；
# 这里保留兜底——历史客户端或排障时手拼的地址仍可能带令牌参数。
map $args $vs_masked_args {
    "~*^(?<vs_pre>.*&|)(?<vs_key>[^&=]*token[^&=]*=)[^&]*(?<vs_post>&.*|)$"  "${vs_pre}${vs_key}***${vs_post}";
    default $args;
}

log_format vs_main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri$is_args$vs_masked_args $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name visionspace.space www.visionspace.space;

    root /opt/visionspace/dist;
    index index.html;

    access_log /var/log/nginx/visionspace.access.log vs_main;
    error_log  /var/log/nginx/visionspace.error.log;

    # 前端路由：静态资源直接返回，其余回落到 SPA 入口
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API、SSE、上传与 WebSocket 共用同一个受控入口：
    # 前端与后端同源，Cookie 不会被带到其他源，CSRF 只需要判定同源与双提交令牌。
    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        # SSE 与协作 WebSocket 都需要长连接和关闭缓冲
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 上传体积上限与应用一致（image + 缩略图）
        client_max_body_size 25m;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

