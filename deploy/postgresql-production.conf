# PostgreSQL 18 生产参数片段（原生部署）
#
# 安装（追加到集群配置并重启）：
#   install -m 644 deploy/postgresql-production.conf /etc/postgresql/18/main/conf.d/vision-space.conf
#   # 或直接追加到 postgresql.conf 末尾
#   systemctl restart postgresql
#
# 数值来自 2 vCPU / 1.7 GB 实机验收（M4，迁移计划附录 F）：
#   shared_buffers 16384×8kB = 128 MB、work_mem 2048 kB、maintenance_work_mem 32768 kB、
#   max_connections 20、TimeZone Asia/Shanghai；应用会话 transaction_isolation = read committed。
# 应用侧连接池 maximum-pool-size=5、minimum-idle=1，与 max_connections=20 之间留有余量。

# 只监听回环：数据库不对外暴露，走本机 socket/回环 TCP
listen_addresses = '127.0.0.1'

# 1.7 GB 内存下的低资源基线
shared_buffers = 128MB
work_mem = 2MB
maintenance_work_mem = 32MB
max_connections = 20

# 墙钟时间契约（ADR-0004 §3）：库、JVM、JDBC 会话三者同区
timezone = 'Asia/Shanghai'
log_timezone = 'Asia/Shanghai'

# 口令一律用 scram-sha-256 存储；口令本身只经环境变量 / app.env 注入
password_encryption = 'scram-sha-256'

# 日志：保留慢查询与连接级信息，够排障即可（磁盘只有 40 GB）
log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %u@%d '
log_connections = off
log_disconnections = off
