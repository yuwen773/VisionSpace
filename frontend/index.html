<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/svg+xml" sizes="16x16" href="/favicon-16x16.svg">
    <link rel="icon" type="image/svg+xml" sizes="32x32" href="/favicon-32x32.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionSpace</title>
    <!-- 网页字体只在这里加载一次：先预连接，再用一条样式表统一取
         Fredoka / Nunito / JetBrains Mono（KaushanScript 走本地 @font-face）。
         之前各样式表重复 @import、跨 .cn/.com 两个域名，还把本地已覆盖的
         KaushanScript 塞进同一个请求；css2 对不认识的字族整条报错，
         品牌字体因此全部回退成系统字体。 -->
    <link rel="preconnect" href="https://fonts.googleapis.cn" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.cn/css2?family=Fredoka:wght@300;400;500;600;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <!-- draw.io 渲染库改为本地依赖（mxgraph），不再从公共 CDN 加载第三方脚本 -->
    <meta name="VisionSpace" content="获取高清免费大图">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
