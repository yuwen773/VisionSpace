name: Container candidate verification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  VS_SRF_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify Compose vision configuration
        shell: pwsh
        run: ./scripts/tests/test-compose-vision-config.ps1
      - name: Verify MySQL init execution modes
        shell: pwsh
        run: ./scripts/tests/test-mysql-init.ps1
      # 构建并启动隔离生产候选：随机回环端口与秘密，断言运行身份、可写范围、
      # 端口发布、生效 profile、SQL 日志卫生，以及依赖故障/恢复/重试耗尽。
      - name: Isolated production candidate (build, run, health)
        shell: pwsh
        run: |
          ./scripts/container-verification.ps1 *> "$env:RUNNER_TEMP/srf-container.raw.log"
          $gateExit = $LASTEXITCODE
          Write-Host "container exit: $gateExit"
          exit $gateExit
      - name: Preserve container evidence on success or failure
        if: always()
        run: |
          python3 -I scripts/publish-evidence.py target/container-verification "$RUNNER_TEMP/srf-artifacts/container"
          python3 -I scripts/runtime-versions.py "$RUNNER_TEMP/srf-artifacts/container/runtime.json"
      - name: Upload safe container outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: srf-container
          path: ${{ runner.temp }}/srf-artifacts/
          if-no-files-found: error
          retention-days: 14
