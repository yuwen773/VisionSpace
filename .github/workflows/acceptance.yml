name: Acceptance baseline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Isolated MySQL, Redis, HTTP regressions and frontend checks
        shell: pwsh
        run: ./scripts/acceptance.ps1
      - name: Preserve evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence
          path: |
            target/acceptance/
          retention-days: 14
