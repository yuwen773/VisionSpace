name: Acceptance baseline

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  VS_SRF_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Isolated MySQL, Redis, HTTP regressions and frontend checks
        shell: pwsh
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          node frontend/node_modules/playwright-core/cli.js install --with-deps chromium
          ./scripts/acceptance.ps1 *> "$env:RUNNER_TEMP/srf-acceptance.raw.log"
          $gateExit = $LASTEXITCODE
          Write-Host "acceptance exit: $gateExit"
          exit $gateExit
      - name: Project safe outcome evidence
        if: always()
        run: |
          python3 -I scripts/publish-evidence.py target/acceptance "$RUNNER_TEMP/srf-artifacts/acceptance"
          python3 -I scripts/runtime-versions.py "$RUNNER_TEMP/srf-artifacts/acceptance/runtime.json"
      - name: Preserve evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: srf-acceptance-${{ github.run_attempt }}
          path: ${{ runner.temp }}/srf-artifacts/
          if-no-files-found: error
          retention-days: 14
