name: SRF final candidate

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  VS_SRF_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  acceptance:
    uses: ./.github/workflows/acceptance.yml
  container:
    uses: ./.github/workflows/container-verification.yml
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: node frontend/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: HTTPS, dual-instance collaboration, UI and diagram DOM/network matrix
        shell: pwsh
        run: ./scripts/srf-browser.ps1
      - name: Project safe browser outcomes
        if: always()
        run: |
          python3 -I scripts/publish-evidence.py target/srf-browser "$RUNNER_TEMP/srf-artifacts/browser"
          python3 -I scripts/runtime-versions.py "$RUNNER_TEMP/srf-artifacts/browser/runtime.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: srf-browser-${{ github.run_attempt }}
          path: ${{ runner.temp }}/srf-artifacts/
          if-no-files-found: error
          retention-days: 14
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.76.2
          cache: true
      - name: Candidate secrets and resolved Maven/npm dependencies
        shell: pwsh
        run: ./scripts/security-verification.ps1
      - name: Project safe scan outcomes
        if: always()
        run: |
          python3 -I scripts/publish-evidence.py target/security-verification "$RUNNER_TEMP/srf-artifacts/security"
          python3 -I scripts/runtime-versions.py "$RUNNER_TEMP/srf-artifacts/security/runtime.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: srf-security-${{ github.run_attempt }}
          path: ${{ runner.temp }}/srf-artifacts/
          if-no-files-found: error
          retention-days: 14
  evidence:
    if: always()
    needs: [acceptance, browser, container, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: srf-*-${{ github.run_attempt }}
          merge-multiple: true
          path: evidence
      - name: Same-candidate T01-T24 engineering ledger
        env:
          SRF_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 -I scripts/srf-evidence.py --root evidence --candidate "$GITHUB_SHA" --run-id "$VS_SRF_RUN_ID" --output srf-evidence.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: srf-ledger-${{ github.run_attempt }}
          path: srf-evidence.json
          if-no-files-found: error
          retention-days: 14
  merge-gate:
    name: SRF merge gate
    if: always()
    needs: [acceptance, browser, container, security, evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require every constituent check to succeed
        env:
          SRF_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 -I scripts/srf-merge-gate.py
