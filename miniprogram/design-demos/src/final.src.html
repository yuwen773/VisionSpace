<script type="text/babel">
/*__FRAME__*/

/* ============================================================

   结构：编辑成册（刊头 / 图版号 / 图注 / 页码），详情页留给一张图
   表面：浅色 = 紫漾，深色 = 极光，色值取 miniprogram/src/styles/tokens.wxss

const SANS = '-apple-system, "PingFang SC", "Noto Sans SC", sans-serif';
const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';

const PAL = {
  light: {
    dark: false,
    bg: '#FAF7FF', panel: '#FFFFFF', tint: '#F5F3FF',
    ink: '#1E1B4B', sub: '#5F6472', faint: '#6B7280',
    rule: '#DDD6FE', accent: '#9333EA',
    boardBg: '#EDE9FE', boardMuted: '#5F6472', onAccent: '#FFFFFF',
  },
  dark: {
    dark: true,
    bg: '#030712', panel: '#0A0F1A', tint: '#111827',
    ink: '#F8FAFC', sub: '#CBD5E1', faint: '#94A3B8',
    rule: 'rgba(148,163,184,0.18)', accent: '#6AA3FF',
    boardBg: '#01040A', boardMuted: '#94A3B8', onAccent: '#030712',

};
let P = PAL.light;

const WORKS = [
  { id: 1, key: 'brooklyn', plate: '014', title: '布鲁克林餐车', author: 'Frank Schulenburg', place: '纽约', year: '2024', size: '1600 × 900', tag: '街拍', lic: 'CC BY-SA 4.0',

    caption: '正午的硬光，人流在斑马线上被切成几段。' },
  { id: 3, key: 'mountains', plate: '016', title: '三姐妹峰', author: 'Dietmar Rabich', place: '蓝山', year: '2019', size: '1600 × 1877', tag: '风景', lic: 'CC BY-SA 4.0',
    caption: '雾从谷底升上来，三块岩柱只剩轮廓。' },
  { id: 4, key: 'glacier', plate: '017', title: '冰川航线', author: 'Steve Hillebrand', place: '阿拉斯加', year: '2016', size: '1600 × 1065', tag: '风景', lic: 'Public domain',
    caption: '航拍高度约两千米，冰裂缝像铅笔划过的痕迹。' },
  { id: 5, key: 'arch', plate: '018', title: '驿站穹顶', author: 'Mostafameraji', place: '库姆', year: '2021', size: '1600 × 1065', tag: '建筑', lic: 'CC BY-SA 4.0',
    caption: '砖砌的穹顶把光线收进中心，四周是黑的。' },
  { id: 6, key: 'still', plate: '019', title: '报春花与石榴', author: 'Henri Fantin-Latour', place: '巴黎', year: '1866', size: '1600 × 1952', tag: '静物', lic: 'Public domain',
    caption: '桌面只有两种颜色：花白的、果子暗的。' },
];

function Rule({ mt = 0, mb = 0 }) {
  return <div style={{ height: 0.5, background: P.rule, marginTop: mt, marginBottom: mb }} />;
}

function Caption({ w }) {
  return (
    <div style={{ marginTop: 6 }}>
      <div style={{ fontSize: 13, color: P.ink, lineHeight: 1.5 }}>
        <span style={{ fontFamily: MONO, fontSize: 12, color: P.accent }}>{w.plate}</span>
        <span style={{ marginLeft: 8 }}>{w.title}</span>
      </div>
      <div style={{ fontSize: 12, color: P.sub, marginTop: 2 }}>{w.author} · {w.year}</div>
    </div>
  );
}

function tabBarProps(tab, onTab) {
  return { list: [{ text: '发现' }, { text: '空间' }, { text: '我的' }], color: P.faint, selectedColor: P.accent, backgroundColor: P.bg, borderColor: P.rule, active: tab, onChange: onTab };
}

/* —— 发现：刊首页 —— */
function DiscoverScreen({ onTab, onOpen, tab }) {

        </div>
        <Rule mt={10} />

        <div style={{ padding: '14px 20px 0' }}>
          <div style={{ fontSize: 34, fontWeight: 600, lineHeight: 1.15, color: P.ink, letterSpacing: '0.01em' }}>夜里的城市</div>

        <div style={{ padding: '12px 20px 0', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>

            </div>
            <Caption w={a} />
          </div>
          <div>
            <div style={{ height: 96, overflow: 'hidden' }}>
              <img src={IMG[b.key]} alt={b.title} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
            </div>
            <Caption w={b} />
          </div>
          <div>
            <div style={{ height: 96, overflow: 'hidden' }}>
              <img src={IMG[c.key]} alt={c.title} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
            </div>
            <Caption w={c} />
          </div>
        </div>

        <Rule mt={10} />

        <div style={{ padding: '10px 20px 0' }}>
          <div style={{ fontSize: 12, color: P.sub, marginBottom: 2 }}>本期目录</div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', columnGap: 18 }}>
            {[['街拍', '014–015 · 5'], ['风景', '016–017 · 4'], ['静物', '018–019 · 2'], ['人像', '020–021 · 4'], ['建筑', '022 · 3'], ['本期', '18 张 · 5 类']].map(([k, v]) => (

/* —— 图片详情：一张图占一屏 —— */

            ))}
          </div>
          <div style={{ marginTop: 16, display: 'flex', alignItems: 'center', gap: 8, padding: '10px 0', borderTop: `0.5px solid ${P.rule}` }}>
            <span style={{ fontSize: 12, color: P.sub }}>同一空间</span>

                <span style={{ fontSize: 12, color: P.sub }}>{type}</span>

              <div style={{ display: 'flex', gap: 6, marginTop: 8 }}>

/* —— 单台手机 —— */
function Phone({ initialTab = '发现', initialDetail = false, initialScreen = null }) {
  const [tab, setTab] = React.useState(initialTab);
  const [detail, setDetail] = React.useState(initialDetail);
  const [screen, setScreen] = React.useState(initialScreen);
  if (screen === 'login') return <LoginScreen />;
  if (screen === 'upload') return <UploadScreen tab={tab} onTab={(v) => { setScreen(null); setTab(v); }} />;
  if (screen === 'spaces') return <SpacesScreen tab={tab} onTab={setTab} />;
  if (screen === 'space-detail') return <SpaceDetailScreen tab={tab} onTab={setTab} />;
  if (detail) return <DetailScreen tab={tab} onTab={setTab} onBack={() => setDetail(false)} />;
  if (tab === '空间') return <SpacesScreen tab={tab} onTab={setTab} />;
  if (tab === '我的') return <MeScreen tab={tab} onTab={setTab} />;
  return <DiscoverScreen tab={tab} onTab={setTab} onOpen={() => setDetail(true)} />;
}
