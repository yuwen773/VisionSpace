<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>检索台 · VisionSpace 小程序 · 方向三</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; background: #E3E6E9; }
  * { -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
<script>const IMG = /*__IMG__*/{};</script>

</head>
<body>
<div id="root"></div>
<script type="text/babel">
/*__FRAME__*/

/* ============================================================
   方向三 · 检索台  —— 首屏是一条检索行，不是瀑布流
   ============================================================ */
const C = {
  page: '#F5F6F7',
  panel: '#FFFFFF',
  ink: '#14161A',
  sub: '#575D65',
  faint: '#666E77',
  line: '#E3E6EA',
  line2: '#EFF1F3',
  accent: '#2F4BDB',
  accentSoft: '#EEF1FF',
  mono: 'ui-monospace, "SF Mono", Menlo, Consolas, monospace',
  sans: '-apple-system, "PingFang SC", "Noto Sans SC", sans-serif',
};

const WORKS = [
  { id: 1, key: 'glacier', title: '冰川航线', author: 'Steve Hillebrand', size: '1600 × 1065', mb: '1.4 MB', tag: '风景', space: '夜里的城市', lic: 'PD' },
  { id: 2, key: 'mountains', title: '三姐妹峰', author: 'Dietmar Rabich', size: '1600 × 1877', mb: '2.1 MB', tag: '风景', space: '夜里的城市', lic: 'CC BY-SA' },
  { id: 3, key: 'arch', title: '驿站穹顶', author: 'Mostafameraji', size: '1600 × 1065', mb: '1.2 MB', tag: '建筑', space: '街拍档案', lic: 'CC BY-SA' },
  { id: 4, key: 'brooklyn', title: '布鲁克林餐车', author: 'Frank Schulenburg', size: '1600 × 900', mb: '0.9 MB', tag: '街拍', space: '夜里的城市', lic: 'CC BY-SA' },
  { id: 5, key: 'still', title: '报春花与石榴', author: 'Henri Fantin-Latour', size: '1600 × 1952', mb: '2.6 MB', tag: '静物', space: '静物与花', lic: 'PD' },
  { id: 6, key: 'portrait', title: '锡安·阿米尔', author: 'Arielinson', size: '1600 × 1200', mb: '1.1 MB', tag: '人像', space: '街拍档案', lic: 'CC BY-SA' },
];

function Hr({ mt = 0, mb = 0, color = C.line }) {
  return <div style={{ height: 0.5, background: color, marginTop: mt, marginBottom: mb }} />;
}

function Tab({ tab, onTab }) {
  const icon = (d, on) => (
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={on ? 2 : 1.7} strokeLinecap="round" strokeLinejoin="round">{d}</svg>
  );
  return {
    list: [
      { text: '发现', icon: (on) => icon(<><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.2-3.2" /></>, on) },
      { text: '空间', icon: (on) => icon(<><path d="M3 8.5L12 3l9 5.5-9 5.5z" /><path d="M3 15.5L12 21l9-5.5" /></>, on) },
      { text: '我的', icon: (on) => icon(<><circle cx="12" cy="8.5" r="3.6" /><path d="M4.8 20c.9-3.6 3.7-5.4 7.2-5.4s6.3 1.8 7.2 5.4" /></>, on) },
    ],
    color: C.faint, selectedColor: C.ink, backgroundColor: C.panel, borderColor: C.line, active: tab, onChange: onTab,
  };
}

function Chip({ children, on, soft }) {
  return (
    <div style={{
      height: 28, padding: '0 11px', borderRadius: 999, display: 'inline-flex', alignItems: 'center',
      fontSize: 12, fontWeight: on ? 600 : 400,
      color: soft ? C.accent : (on ? C.accent : C.sub),
      background: soft ? C.accentSoft : (on ? C.accentSoft : 'transparent'),
      border: `0.5px solid ${on || soft ? C.accentSoft : C.line}`,
    }}>{children}</div>
  );
}

/* —— 检索台首屏 —— */
function SearchScreen({ onTab, onOpen, tab }) {
  return (
    <WechatFrame page="pages/discover/index" nav="custom" navText="black" background={C.page} tab={tab} onTabChange={onTab}
      tabBar={{ ...Tab({ tab, onTab }) }}>
      <div style={{ paddingTop: 84, paddingBottom: 90, fontFamily: C.sans }}>
        <div style={{ padding: '4px 16px 0' }}>
          <div style={{ height: 44, background: C.panel, borderRadius: 13, display: 'flex', alignItems: 'center', gap: 9, padding: '0 12px', boxShadow: '0 0 0 0.5px rgba(20,22,26,0.06), 0 2px 6px rgba(20,22,26,0.04)' }}>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke={C.accent} strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.2-3.2" /></svg>
            <span style={{ fontSize: 15, color: C.ink, flex: 1 }}>雪山<span style={{ color: C.accent, marginLeft: 1 }}>|</span></span>
            <span style={{ width: 18, height: 18, borderRadius: 9, background: C.line2, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
              <svg width="8" height="8" viewBox="0 0 8 8" fill="none" stroke={C.sub} strokeWidth="1.5" strokeLinecap="round"><path d="M1 1l6 6M7 1L1 7" /></svg>
            </span>
          </div>
        </div>

        <div style={{ display: 'flex', gap: 18, padding: '16px 18px 0', fontSize: 13, color: C.faint }}>
          {['全部', '热门', '最新', '精选'].map((t, i) => (
            <span key={t} style={{ color: i === 3 ? C.ink : C.faint, fontWeight: i === 3 ? 600 : 400, position: 'relative', paddingBottom: 7 }}>
              {t}
              {i === 3 && <span style={{ position: 'absolute', left: 0, right: 0, bottom: 0, height: 2, background: C.accent, borderRadius: 2 }} />}
            </span>
          ))}
        </div>
        <Hr mt={0} />

        <div style={{ display: 'flex', gap: 8, padding: '12px 16px 0', overflow: 'hidden' }}>
          {['风景', '人像', '街拍', '静物', '建筑'].map((t, i) => <Chip key={t} on={i === 0}>{t}</Chip>)}
        </div>

        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', padding: '16px 18px 0' }}>
          <span style={{ fontSize: 12, color: C.sub }}>12 个结果 · 仅公开图库</span>
          <span style={{ fontFamily: C.mono, fontSize: 12, color: C.faint }}>相关度 ↓</span>
        </div>

        <div style={{ padding: '2px 16px 0' }}>
          {WORKS.slice(0, 6).map((w) => (
            <div key={w.id} onClick={() => onOpen(w)} style={{ display: 'flex', alignItems: 'center', gap: 11, padding: '9px 0', borderBottom: `0.5px solid ${C.line}`, cursor: 'pointer' }}>
              <img src={IMG[w.key]} alt={w.title} style={{ width: 46, height: 46, borderRadius: 8, objectFit: 'cover', flexShrink: 0 }} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 14, color: C.ink, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{w.title}</div>
                <div style={{ fontSize: 12, color: C.sub, marginTop: 2 }}>{w.author} · {w.tag}</div>
              </div>
              <div style={{ textAlign: 'right', flexShrink: 0 }}>
                <div style={{ fontFamily: C.mono, fontSize: 12, color: C.sub }}>{w.size}</div>
                <div style={{ fontFamily: C.mono, fontSize: 12, color: C.faint, marginTop: 3 }}>{w.mb}</div>
              </div>
            </div>
          ))}
        </div>
        <div style={{ padding: '14px 16px 0' }}>
          <div style={{ height: 40, borderRadius: 10, border: `0.5px solid ${C.line}`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13, color: C.sub }}>查看全部 12 个结果</div>
        </div>
      </div>
    </WechatFrame>
  );
}

/* —— 图片详情 —— */
function DetailScreen({ onTab, onBack, tab }) {
  const w = WORKS[1];
  const rows = [['尺寸', w.size], ['格式', 'JPEG · sRGB'], ['主色', '#3D463A'], ['空间', w.space], ['许可', w.lic], ['上传', '2026-11-18']];
  return (
    <WechatFrame page="pages/picture/index" nav="custom" navText="black" background={C.page}>
      <div style={{ paddingTop: 84, paddingBottom: 90, fontFamily: C.sans }}>
        <div onClick={onBack} style={{ padding: '6px 16px 10px', fontSize: 13, color: C.sub, cursor: 'pointer' }}>← 结果</div>
        <div style={{ padding: '0 16px' }}>
          <img src={IMG[w.key]} alt={w.title} style={{ width: '100%', height: 176, objectFit: 'cover', borderRadius: 14, display: 'block' }} />
          <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginTop: 14 }}>
            <span style={{ fontSize: 19, fontWeight: 600, color: C.ink }}>{w.title}</span>
            <Chip soft>{w.tag}</Chip>
          </div>
          <div style={{ fontSize: 12, color: C.sub, marginTop: 4 }}>{w.author} · 2019 · 蓝山</div>

          <div style={{ marginTop: 14, background: C.panel, borderRadius: 12, padding: '2px 12px', boxShadow: '0 0 0 0.5px rgba(20,22,26,0.05)' }}>
            {rows.map(([k, v], i) => (
              <div key={k} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', padding: '9px 0', borderBottom: i === rows.length - 1 ? 'none' : `0.5px solid ${C.line2}` }}>
                <span style={{ fontSize: 12, color: C.faint }}>{k}</span>
                <span style={{ fontFamily: C.mono, fontSize: 12, color: C.ink }}>{v}</span>
              </div>
            ))}
          </div>

          <div style={{ display: 'flex', gap: 10, marginTop: 14 }}>
            <div style={{ flex: 1, height: 40, borderRadius: 10, background: C.ink, color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14 }}>收藏</div>
            <div style={{ flex: 1, height: 40, borderRadius: 10, border: `0.5px solid ${C.line}`, background: C.panel, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, color: C.ink }}>下载原图</div>
          </div>

          <div style={{ marginTop: 16, display: 'flex', alignItems: 'center', justifyContent: 'space-between', fontSize: 12 }}>
            <span style={{ color: C.sub }}>同一空间 · <span style={{ color: C.ink }}>{w.space}</span></span>
            <span style={{ color: C.accent }}>18 张查看</span>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8, marginTop: 8 }}>
            {WORKS.slice(2, 5).map((x) => (
              <img key={x.id} src={IMG[x.key]} alt={x.title} style={{ width: '100%', height: 56, objectFit: 'cover', borderRadius: 8, display: 'block' }} />
            ))}
          </div>
          <div style={{ marginTop: 16, paddingTop: 10, borderTop: `0.5px solid ${C.line}`, display: 'flex', justifyContent: 'space-between', fontFamily: C.mono, fontSize: 12, color: C.faint }}>
            <span>ID 018 · 审核通过</span><span>2026-11-18</span>
          </div>
        </div>
      </div>
    </WechatFrame>
  );
}

/* —— 空间列表 —— */
function SpacesScreen({ onTab, tab }) {
  const list = [
    ['夜里的城市', '个人空间', '18 张', '128.4 MB', '1.0 GB', 12],
    ['街拍档案', '团队 · 4 人', '42 张', '806 MB', '1.0 GB', 78],
    ['静物与花', '个人空间', '6 张', '34.1 MB', '1.0 GB', 3],
  ];
  return (
    <WechatFrame page="pages/space/index" nav="custom" navText="black" background={C.page} tab={tab} onTabChange={onTab}
      tabBar={{ ...Tab({ tab, onTab }) }}>
      <div style={{ paddingTop: 84, paddingBottom: 90, fontFamily: C.sans }}>
        <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', padding: '6px 16px 0' }}>
          <span style={{ fontSize: 22, fontWeight: 600, color: C.ink }}>空间</span>
          <span style={{ fontSize: 13, color: C.accent }}>+ 新建</span>
        </div>
        <div style={{ fontSize: 12, color: C.sub, padding: '4px 16px 0' }}>3 个空间 · 已用 968.5 MB / 3.0 GB</div>

        <div style={{ padding: '14px 16px 0', display: 'flex', flexDirection: 'column', gap: 10 }}>
          {list.map(([name, type, count, used, cap, pct]) => (
            <div key={name} style={{ background: C.panel, borderRadius: 14, padding: '13px 14px 12px', boxShadow: '0 0 0 0.5px rgba(20,22,26,0.05)' }}>
              <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between' }}>
                <span style={{ fontSize: 15, fontWeight: 600, color: C.ink }}>{name}</span>
                <span style={{ fontSize: 12, color: C.faint }}>{type}</span>
              </div>
              <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginTop: 5 }}>
                <span style={{ fontFamily: C.mono, fontSize: 12, color: C.sub }}>{count} · {used} / {cap}</span>
                <span style={{ fontFamily: C.mono, fontSize: 12, color: pct > 70 ? C.accent : C.faint }}>{pct}%</span>
              </div>
              <div style={{ height: 3, borderRadius: 2, background: C.line2, marginTop: 8 }}>
                <div style={{ width: `${pct}%`, height: 3, borderRadius: 2, background: pct > 70 ? C.accent : C.ink }} />
              </div>
            </div>
          ))}
        </div>
        <div style={{ padding: '16px 16px 0', fontSize: 14, color: C.faint, lineHeight: 1.7 }}>空间可以私有，也可以邀请同伴一起维护。团队空间按成员角色分配上传与审核权限。</div>
      </div>
    </WechatFrame>
  );
}

/* —— 空间详情 —— */
function SpaceDetailScreen({ onTab, tab }) {
  const files = [
    ['布鲁克林餐车', '已通过', '0.9 MB', 'brooklyn'],
    ['三姐妹峰', '已通过', '2.1 MB', 'mountains'],
    ['冰川航线', '待审核', '1.4 MB', 'glacier'],
    ['锡安·阿米尔', '已通过', '1.1 MB', 'portrait'],
    ['蒙特利尔街头', '已通过', '1.6 MB', 'montreal'],
    ['驿站穹顶', '已通过', '1.2 MB', 'arch'],
  ];
  return (
    <WechatFrame page="pages/space-detail/index" nav="custom" navText="black" background={C.page}>
      <div style={{ paddingTop: 84, paddingBottom: 90, fontFamily: C.sans }}>
        <div style={{ padding: '6px 16px 0' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <span style={{ fontSize: 20, fontWeight: 600 }}>夜里的城市</span>
            <span style={{ fontSize: 12, color: C.accent, background: C.accentSoft, borderRadius: 5, padding: '2px 6px' }}>个人</span>
          </div>
          <div style={{ fontSize: 12, color: C.sub, marginTop: 4 }}>创建于 2026-09 · 成员 1 人</div>
        </div>

        <div style={{ margin: '12px 16px 0', background: C.panel, borderRadius: 12, display: 'grid', gridTemplateColumns: '1fr 1fr', boxShadow: '0 0 0 0.5px rgba(20,22,26,0.05)' }}>
          {[['图片', '18', '张'], ['已用', '128.4', 'MB'], ['上限', '1.0', 'GB'], ['本月上传', '18', '张']].map(([k, v, u], i) => (
            <div key={k} style={{ padding: '12px 14px', borderBottom: i < 2 ? `0.5px solid ${C.line2}` : 'none', borderRight: i % 2 === 0 ? `0.5px solid ${C.line2}` : 'none' }}>
              <div style={{ fontSize: 12, color: C.faint }}>{k}</div>
              <div style={{ marginTop: 2 }}>
                <span style={{ fontFamily: C.mono, fontSize: 18, color: C.ink }}>{v}</span>
                <span style={{ fontFamily: C.mono, fontSize: 12, color: C.sub, marginLeft: 5 }}>{u}</span>
              </div>
            </div>
          ))}
        </div>

        <div style={{ display: 'flex', gap: 8, padding: '14px 16px 0' }}>
          <Chip on>全部 18</Chip><Chip>待审核 1</Chip><Chip>已通过 17</Chip>
        </div>

        <div style={{ padding: '6px 16px 0' }}>
          {files.map(([n, s, size, key]) => (
            <div key={n} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '9px 0', borderBottom: `0.5px solid ${C.line}` }}>
              <img src={IMG[key]} alt={n} style={{ width: 34, height: 34, borderRadius: 8, objectFit: 'cover', flexShrink: 0 }} />
              <span style={{ flex: 1, fontSize: 13.5, color: C.ink }}>{n}.jpg</span>
              <span style={{ fontSize: 12, color: s === '待审核' ? C.accent : C.sub, background: s === '待审核' ? C.accentSoft : 'transparent', borderRadius: 4, padding: s === '待审核' ? '2px 5px' : 0 }}>{s}</span>
              <span style={{ fontFamily: C.mono, fontSize: 12, color: C.faint, width: 52, textAlign: 'right' }}>{size}</span>
            </div>
          ))}
          <div style={{ textAlign: 'center', fontSize: 12, color: C.accent, padding: '14px 0 0' }}>查看全部 18 个文件</div>
        </div>

        <div style={{ padding: '18px 16px 0' }}>
          <div style={{ fontSize: 12, color: C.faint, marginBottom: 6 }}>成员</div>
          <div style={{ background: C.panel, borderRadius: 12, padding: '0 13px', boxShadow: '0 0 0 0.5px rgba(20,22,26,0.05)' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '11px 0' }}>
              <div style={{ width: 26, height: 26, borderRadius: 13, background: C.ink, color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11 }}>林</div>
              <span style={{ flex: 1, fontSize: 13, color: C.ink }}>林一舟</span>
              <span style={{ fontSize: 12, color: C.faint }}>创建者 · 可上传与审核</span>
            </div>
          </div>
        </div>
      </div>
    </WechatFrame>
  );
}

/* —— 上传 —— */
function UploadScreen({ onTab, tab }) {
  const queue = [
    ['布鲁克林餐车.jpg', '1.2 MB / 1.2 MB', 100, '待审核'],
    ['蒙特利尔街头.jpg', '0.8 MB / 1.6 MB', 52, '上传中'],
    ['三姐妹峰.jpg', '0 B / 2.1 MB', 0, '排队'],
  ];
  return (
    <WechatFrame page="pages/upload/index" nav="custom" navText="black" background={C.page}>
      <div style={{ paddingTop: 84, paddingBottom: 90, fontFamily: C.sans }}>
        <div style={{ padding: '6px 16px 0', fontSize: 20, fontWeight: 600 }}>上传</div>

        <div style={{ margin: '12px 16px 0', background: C.panel, borderRadius: 12, padding: '11px 13px', boxShadow: '0 0 0 0.5px rgba(20,22,26,0.05)', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <div>
            <div style={{ fontSize: 12, color: C.faint }}>上传到</div>
            <div style={{ fontSize: 14, color: C.ink, marginTop: 2 }}>夜里的城市</div>
          </div>
          <span style={{ fontSize: 12, color: C.accent }}>更换</span>
        </div>

        <div style={{ margin: '12px 16px 0', height: 104, borderRadius: 12, border: `1px dashed ${C.line}`, background: 'rgba(255,255,255,0.6)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 6 }}>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={C.sub} strokeWidth="1.6" strokeLinecap="round"><path d="M12 16V5" /><path d="M7 10l5-5 5 5" /><path d="M4 17v2.5A1.5 1.5 0 005.5 21h13a1.5 1.5 0 001.5-1.5V17" /></svg>
          <span style={{ fontSize: 13, color: C.ink }}>选择照片</span>
          <span style={{ fontFamily: C.mono, fontSize: 12, color: C.faint }}>JPG / PNG · ≤10 MB · 9 张</span>
        </div>

        <div style={{ padding: '16px 16px 0' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, color: C.faint, marginBottom: 6 }}>
            <span>队列 3</span><span>完成 1 / 3</span>
          </div>
          {queue.map(([n, size, pct, st]) => (
            <div key={n} style={{ padding: '8px 0', borderBottom: `0.5px solid ${C.line}` }}>
              <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between' }}>
                <span style={{ fontSize: 13, color: C.ink }}>{n}</span>
                <span style={{ fontSize: 12, color: st === '待审核' ? C.accent : C.sub }}>{st}</span>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 5 }}>
                <div style={{ flex: 1, height: 2, borderRadius: 2, background: C.line2 }}>
                  <div style={{ width: `${pct}%`, height: 2, borderRadius: 2, background: C.accent }} />
                </div>
                <span style={{ fontFamily: C.mono, fontSize: 12, color: C.faint, width: 118, flexShrink: 0, whiteSpace: 'nowrap', textAlign: 'right' }}>{size}</span>
              </div>
            </div>
          ))}
        </div>

        <div style={{ margin: '16px 16px 0', height: 42, borderRadius: 10, background: C.ink, color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14 }}>
          继续上传 2 张
        </div>
        <div style={{ margin: '12px 16px 0', fontSize: 13, color: C.sub, lineHeight: 1.7 }}>上传完成后进入审核，通过即出现在公开图库，未通过的图只保留在你的空间里。</div>

        <div style={{ margin: '14px 16px 0', background: C.panel, borderRadius: 12, padding: '0 13px', boxShadow: '0 0 0 0.5px rgba(20,22,26,0.05)' }}>
          {[['自动压缩', '超过 2000px 缩到 2000px', true], ['保留原图', '占用空间翻倍', false]].map(([k, d, on], i) => (

function Phone({ initialTab = '发现', initialDetail = false, initialScreen = null }) {
  const [tab, setTab] = React.useState(initialTab);
  const [detail, setDetail] = React.useState(initialDetail);
  const [screen, setScreen] = React.useState(initialScreen);
  if (screen === 'login') return <LoginScreen />;
  if (screen === 'upload') return <UploadScreen tab={tab} onTab={(v) => { setScreen(null); setTab(v); }} />;
  if (screen === 'spaces') return <SpacesScreen tab={tab} onTab={setTab} />;
  if (screen === 'space-detail') return <SpaceDetailScreen tab={tab} onTab={setTab} />;
  if (detail) return <DetailScreen tab={tab} onTab={setTab} onBack={() => setDetail(false)} />;
  if (tab === '空间') return <SpacesScreen tab={tab} onTab={setTab} />;
  if (tab === '我的') return <MeScreen tab={tab} onTab={setTab} />;
  return <SearchScreen tab={tab} onTab={setTab} onOpen={() => setDetail(true)} />;
}

      theme={theme}
