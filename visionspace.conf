server
{
    listen 80;
    server_name visionspace.space;

    # 前端静态文件
    root /home/ubuntu/projects/VisionSpace/dist;
    index index.html;

    # 访问日志
    access_log /www/wwwlogs/visionspace.access.log;
    error_log /www/wwwlogs/visionspace.error.log;

    # 前端路由 - 静态资源直接返回
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持（如有）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 静态资源缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
