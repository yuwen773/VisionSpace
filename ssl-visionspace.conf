server
{
    listen 80;
    server_name visionspace.space;
    # 强制跳转 HTTPS
    return 301 https://$server_name$request_uri;
}

server
{
    listen 443 ssl http2;
    server_name visionspace.space;

    # SSL 证书
    ssl_certificate /etc/nginx/ssl/visionspace.space/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/visionspace.space/visionspace.space.key;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 前端静态文件
    root /home/ubuntu/projects/VisionSpace/dist;
    index index.html;

    # 访问日志
    access_log /www/wwwlogs/visionspace.access.log;
    error_log /www/wwwlogs/visionspace.error.log;

    # 前端路由 - 静态资源直接返回
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 静态资源缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
